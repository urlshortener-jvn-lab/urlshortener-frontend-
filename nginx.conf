map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# --- CẤU HÌNH RATE LIMIT TẠI TẦNG REVERSE PROXY (NGINX) ---
# 1. Chỉ áp dụng Rate Limit cho lệnh POST (tạo link), còn lệnh GET/DELETE thì gán chuỗi rỗng "" (Nginx sẽ bỏ qua không giới hạn)
map $request_method $limit_post_key {
    default "";
    POST    $binary_remote_addr;
}

# 2. Tạo vùng nhớ chung trên RAM của Nginx tên là "shorten_limit" rộng 10MB (lưu được ~160,000 IP)
#    rate=30r/m nghĩa là cho phép đúng 30 request / 1 phút cho mỗi IP (tương đương 1 request mỗi 2 giây)
limit_req_zone $limit_post_key zone=shorten_limit:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sử dụng Docker Embedded DNS (127.0.0.11) với TTL 5 giây để tự động cập nhật danh sách IP khi scale lên/xuống số lượng container backend
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Nén Gzip tăng tốc tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cache static assets (JS/CSS có hash của Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy & Load Balance các request /api/ sang cụm Backend Replicas
    location /api/ {
        # Áp dụng Rate Limit tại cửa ngõ Nginx:
        # burst=29 + nodelay: Cho phép khách bắn dồn dập tối đa đúng 30 phát (1 phát gốc + 29 phát burst) ngay lập tức, phát thứ 31 trả về 429 ngay tại Nginx!
        limit_req zone=shorten_limit burst=29 nodelay;

        set $backend_upstream "${API_UPSTREAM_URL}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Failover tự động sang replica khác nếu 1 container bị chết hoặc timeout
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Trả về IP:Port của container Backend thực tế đã xử lý request để dễ quan sát Load Balancing
        add_header X-Upstream-Addr $upstream_addr always;
    }

    # Proxy & Load Balance các request rút gọn /r/{code} sang cụm Backend Replicas
    location /r/ {
        set $backend_upstream "${API_UPSTREAM_URL}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        add_header X-Upstream-Addr $upstream_addr always;
    }

    # Proxy Health Check & Scalar UI qua Nginx để xem được ngay trên cổng 3000 khi Backend không mở port ra ngoài
    location /health {
        set $backend_upstream "${API_UPSTREAM_URL}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location /openapi/ {
        set $backend_upstream "${API_UPSTREAM_URL}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /scalar/ {
        set $backend_upstream "${API_UPSTREAM_URL}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check của chính container Frontend Nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
