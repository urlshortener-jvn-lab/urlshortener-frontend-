name: Frontend CI/CD — Typecheck, Build & Push Image

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # STAGE 1: VALIDATE & BUILD (React 19 + TypeScript + Vite 7)
  # ============================================================================
  validate:
    name: "CI: Typecheck & Build Vite Static Assets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install & Build
        run: |
          npm ci
          npm run build

  # ============================================================================
  # STAGE 2: BUILD & PUSH DOCKER IMAGE + UPDATE MANIFEST REPO (GitOps)
  # ============================================================================
  build-and-push:
    name: "CD: Build & Push urlshortener-fe Image"
    needs: [validate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Short SHA Tag
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/urlshortener-fe:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/urlshortener-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Manifests Repo (GitOps Auto-Tag Update)
        if: ${{ secrets.MANIFEST_REPO_TOKEN != '' }}
        env:
          MANIFEST_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NEW_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          git clone https://x-access-token:${MANIFEST_TOKEN}@github.com/${OWNER}/urlshortener-manifests.git manifests
          cd manifests
          sed -i "s|frontendTag:.*|frontendTag: \"${NEW_TAG}\"|g" helm/urlshortener/values.yaml || true
          git config user.name "github-actions-bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "chore(gitops): update urlshortener-fe image tag to ${NEW_TAG}" && git push)
